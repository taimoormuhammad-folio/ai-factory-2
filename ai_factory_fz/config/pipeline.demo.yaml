# Demo pipeline: a very small app, built and released end to end in one sitting.
# Use it with:  uv run kickoff --brief briefs/demo_mini.md --pipeline pipeline.demo

phases:
  discovery: true
  planning: true
  design: true
  build: true
  release: true

# Hard limits for the planning agents; their output is rejected if it goes over.
scope:
  guidance: >
    This is a demo build. Keep only the core journey: browse products, see one product,
    add it to a cart, view the cart. No user accounts or sign-in (the app creates an anonymous
    cart id and keeps it on the device), no payments or checkout, no admin tools, no emails.
    Seed a handful of demo products in the database.
  max_user_stories: 4
  max_work_items: 6
  max_milestones: 2
  max_api_operations: 6
  max_screens: 3

# Model overrides for this pipeline (same format as config/models.yaml `agents:`).
# All agents already use Haiku in models.yaml; these keep heavy agents on the shared tier.
models:
  architect: balanced
  backend_developer: balanced
  frontend_developer: balanced

planning:
  # Developers re-estimate the items they will build; the PM reconciles big gaps.
  estimation_review: true
  big_gap_points: 3          # a gap this big (or a 2x ratio) goes to the PM to reconcile
  big_gap_ratio: 2.0

guardrails:
  # Checks on the Architect's output; a failing design goes back to the Architect.
  # A1 stack, A2 mobile platform, A3 repository layout, B1 prose matches contract, B2 health endpoint, B3 API prefix,
  # B4 shared error schema, B5 typed responses, B6 auth per operation, C1 entities exist,
  # C2 money as integers, C3 id + timestamps, D1 3+ ADRs, D2 security basics, D3 no secrets.
  architect: [A1, A2, A3, B1, B2, B3, B4, B5, B6, C1, C2, C3, D1, D2, D3]
  # Checks on the other agents' work (a failing result goes back to the same agent):
  # DV1 no weakening tests, DV2 no secrets, DV3 stay in scope (coding agents); QA1 consistent
  # verdict, QA2 real work items (QA engineer, Integration pass); DE1 container hygiene
  # (Deployment engineer); ST1 real smoke/device suites (Smoke tester); CU1 all questions answered
  # (Customer); UX1 valid colours, unique routes, WCAG AA contrast (UI/UX designer).
  agents: [DV1, DV2, DV3, QA1, QA2, DE1, ST1, CU1, UX1]

build:
  milestones: []             # all of them (the scope keeps it to two)
  sandbox: docker            # SDLC_SANDBOX=local overrides
  check_fix_attempts: 2
  agent_timeout_s: 1800

release:
  staging_port: 3100
  startup_timeout_s: 120
  fix_rounds: 1
  # Run the mobile app on an Android emulator against staging (needs `uv run setup-android` once).
  device:
    enabled: true
    headless: true           # pipeline runs; `uv run showcase` opens a window
    boot_timeout_s: 420
  production_command: ""     # package only
  production_timeout_s: 900

# Every gate asks you (y/n) on the terminal.
gates:
  prd: true
  architecture: true
  release: true

# Risk tier L | M | H (the intake can set it per run). Tier L may waive the design gate
# (gates.architecture_waiver_at_tier_l) and is required for gate_mode auto.
risk_tier: M
# console: ask on the terminal. async: stop and wait for `uv run approve <run_id> <G> --as "Name"`,
# then `uv run resume`. auto: demo pipelines at tier L only. Override with SDLC_GATE_MODE.
gate_mode: console

limits:
  clarification_rounds: 1
  gate_rejections: 3
  qa_fix_rounds: 2

budget:
  max_total_tokens: 1500000  # uncached tokens
