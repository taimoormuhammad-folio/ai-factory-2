# Model registry: which LLM each agent uses.

#

# Development vs demo day is chosen in .env (not here):

#   LLM_PROVIDER=cursor_cli     -> Cursor subscription via local `agent` CLI (cheap for daily work)

#   LLM_PROVIDER=cursor_proxy   -> Cursor via local OpenAI-compatible proxy

#   LLM_PROVIDER=anthropic      -> Claude; then CLAUDE_CODE_ENABLE picks Code vs API:

#       CLAUDE_CODE_ENABLE=true   -> through Claude Code (`claude -p`) with CLAUDE_CODE_OAUTH_TOKEN

#       CLAUDE_CODE_ENABLE=false  -> the Claude API with ANTHROPIC_API_KEY

#

# Tiers: reasoning = Opus 5.5 (design), balanced = Sonnet 5.5 (most agents), fast = Haiku 4.5 (quick checks).

# Keep anthropic/... model ids so flipping LLM_PROVIDER=anthropic needs no other edits.

defaults:
  max_tokens: 16000 # API path only; Claude Code / Cursor choose their own output limit

  timeout: 1200 # seconds per call

tiers:
  reasoning:
    model: anthropic/claude-opus-5-5

    fallbacks: [anthropic/claude-sonnet-5-5]

  balanced:
    model: anthropic/claude-sonnet-5-5

    fallbacks: [anthropic/claude-haiku-4-5-20251001]

  fast:
    model: anthropic/claude-haiku-4-5-20251001

    fallbacks: [anthropic/claude-haiku-4-5-20251001]

# agent key -> tier name, or an inline {model, fallbacks, timeout, effort, ...} mapping.

# `effort` (low | medium | high | xhigh | max) applies on the Claude Code path only.

agents:
  business_analyst: balanced
  project_manager: balanced

  architect:
    model: anthropic/claude-opus-5-5

    fallbacks: [anthropic/claude-sonnet-5-5]

    effort: high

    timeout: 1800

    max_tokens: 32000 # ArchitectureDoc includes full OpenAPI + Prisma; 16k truncates often

  ui_ux_designer: balanced

  backend_developer: balanced

  frontend_developer: balanced

  qa_engineer: balanced

  deployment_engineer: balanced

  integration_pass: balanced

  smoke_tester: fast
