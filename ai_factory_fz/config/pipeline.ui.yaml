# UI-driven runs from ai_factory_ui (React console).
# Uses async gates: the run stops at each enabled gate; the React UI approves, then the API resumes.

phases:
  discovery: true
  planning: true
  design: true
  build: true
  release: false

scope:
  guidance: >
    SPEED DEMO. Deliver the smallest runnable Flutter MVP only.
    Must-have screens: product list (browse) and product detail. Optional: simple cart in memory.
    NO auth, NO payments, NO checkout, NO backend API work in M1 if it slows delivery —
    prefer a local/mock catalog in the Flutter app so the app runs on an emulator immediately.
    Style tokens may be chosen by the agent without waiting. Start coding in the first build items.
  max_user_stories: 3
  max_work_items: 5
  max_milestones: 1
  max_api_operations: 4
  max_screens: 3

guardrails:
  architect: [A1, A2, A3, B1, B2, B3, B4, B5, B6, C1, C2, C3, D1, D2, D3, D4]
  agents: [DV1, DV2, DV3, QA1, QA2, DE1, ST1]

design:
  mockups: true
  mockup_states: [success, loading, error, empty]
  max_states_per_screen: 4
  viewport: [390, 844]

build:
  acceptance_tests: true
  parallel: true
  verify: true
  review: true
  milestones: []
  sandbox: local
  check_fix_attempts: 1
  agent_timeout_s: 900

gates:
  prd: true          # G1
  architecture: true # G2
  estimate: true     # G3
  ui: true           # G4 (mockups in docs/ui/)
  merge: true        # G5 (needs risk note)
  release: false     # G6
  production: false  # G7 — off for console MVP runs

risk_tier: M
# Not a silent auto-approve demo: React console is the human approver.
demo: false
# async: stop and wait for UI/API (or `uv run approve`); then resume.
gate_mode: async

limits:
  gate_rejections: 2
  qa_fix_rounds: 1
