# UI-driven runs from ai_factory_ui (React console). Auto-approves gates; no release/docker emulator.
# Tuned for a fast local demo: small Flutter MVP that can reach build quickly.

phases:
  discovery: true
  planning: true
  design: true
  build: true
  release: false

scope:
  guidance: >
    SPEED DEMO. Deliver the smallest runnable Flutter MVP only.
    Must-have screens: product list (browse) and product detail. Optional: simple cart in memory.
    NO auth, NO payments, NO checkout, NO backend API work in M1 if it slows delivery —
    prefer a local/mock catalog in the Flutter app so the app runs on an emulator immediately.
    NEVER create work items that require human approval, stakeholder sign-off, or "style approval".
    Style tokens may be chosen by the agent without waiting. Start coding in the first build items.
  max_user_stories: 3
  max_work_items: 5
  max_milestones: 1
  max_api_operations: 4
  max_screens: 3

guardrails:
  # Checks on the Architect's output; a failing design goes back to the Architect.
  # A1 stack, A2 mobile platform, A3 repository layout, B1 prose matches contract, B2 health endpoint, B3 API prefix,
  # B4 shared error schema, B5 typed responses, B6 auth per operation, C1 entities exist,
  # C2 money as integers, C3 id + timestamps, D1 3+ ADRs, D2 security basics, D3 no secrets.
  architect: [A1, A2, A3, B1, B2, B3, B4, B5, B6, C1, C2, C3, D1, D2, D3, D4]
  # Checks on the other agents' work (a failing result goes back to the same agent):
  # DV1 no weakening tests, DV2 no secrets, DV3 stay in scope (coding agents); QA1 consistent
  # verdict, QA2 real work items (QA engineer, Integration pass); DE1 container hygiene
  # (Deployment engineer); ST1 real smoke/device suites (Smoke tester).
  agents: [DV1, DV2, DV3, QA1, QA2, DE1, ST1]

design:
  # UI/UX designer draws a mockup of each screen state (docs/ui/: HTML pages, PNGs, index.html gallery
  # shown at the UI gate, G4). PNGs need Chrome or Chromium; without it only the HTML pages are written.
  mockups: true
  mockup_states: [success, loading, error, empty]   # kinds of states to draw, matched to each screen's spec
  max_states_per_screen: 4
  viewport: [390, 844]

build:
  # Test Writer writes acceptance tests per milestone before the build; they must fail first, then
  # they are locked (tests.lock) and builders may not change them.
  acceptance_tests: true
  # Backend (+infra) and frontend lanes build at the same time; app tasks work against the contract.
  parallel: true
  # Every QA round: the Integrator's checks (combined build and tests, contract copies, locked tests, secrets)
  # and the profile's scans, with raw results in reports/; then, if clean, the Code Reviewer.
  verify: true
  review: true
  milestones: []
  sandbox: local
  check_fix_attempts: 1
  agent_timeout_s: 900

gates:
  prd: true          # G1 spec approval (customer, through the Product Owner)
  architecture: true # G2 design approval (human architect)
  estimate: true       # G3 estimate approval (customer, through the Product Owner)
  ui: true             # G4 UI design approval (customer, through the Product Owner)
  merge: true         # G5 merge approval (developer of record, with a risk note)
  release: false      # G6 UAT sign-off (customer, through the Product Owner)
  production: true   # G7 go-live approval (named approver; the run then ends ready to deploy)

# Risk tier L | M | H (the intake can set it per run). Tier L may waive the design gate
# (gates.architecture_waiver_at_tier_l) and is required for gate_mode auto.
risk_tier: L
# Demo/test pipeline: allows gate_mode auto (gates approved without a person, recorded as "auto").
demo: true
# console: ask on the terminal. async: stop and wait for `uv run approve <run_id> <G> --as "Name"`,
# then `uv run resume`. auto: demo pipelines at tier L only. Override with SDLC_GATE_MODE.
gate_mode: auto

limits:
  gate_rejections: 2
  qa_fix_rounds: 1

# No hard stop on tokens — coding agents (esp. Flutter WI loops) routinely exceed 1M.
