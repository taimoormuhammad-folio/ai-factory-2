# Release 2 expansion on an existing ShopEase run (same run id, Pass 2).
# Set in state.json pipeline field when merging the Release 2 brief (merge_release2_brief.py).
# Pass 1 used pipeline.client (M1 + M2). This profile plans and builds M3 only.

phases:
  discovery: true
  planning: true
  design: true
  build: true
  release: false

scope:
  guidance: >
    RELEASE 2 EXPANSION on the existing ShopEase codebase in this run workspace. Pass 1 already
    delivered M1 (Flutter guest catalog demo) and M2 (NestJS catalog API + optional Dart client).
    Do NOT replan or duplicate M1/M2 baseline work items. Treat catalog list/detail/cart/API client
    as already shipped unless a Release 2 feature requires a small delta fix.
    Plan exactly ONE milestone M3 named "Release 2 — shopper depth" with NEW work items only
    (continue IDs from WI-010 upward). Implement the Release 2 section of the run brief:
    accounts (register, login, logout, secure token storage, password-reset stub), guest plus
    signed-in (cart merge on login per clarifications), home route (banners, featured, new arrivals,
    categories), search/sort/filters (brand, availability), wishlist (API sync when signed in),
    checkout (US shipping, USD, tax line, mock payment), order history and tracking statuses,
    coupon at checkout, in-app support, and NestJS/Prisma/OpenAPI extensions for auth, orders,
    coupons as needed. Quality: flutter analyze/test green, server tests for new endpoints, one QA
    round on M3. Out of scope: full admin panel, production push, real payment keys.
  max_user_stories: 12
  max_work_items: 12
  max_milestones: 1
  max_api_operations: 24
  max_screens: 12

guardrails:
  architect: [A1, A2, B1, B2, B3, B4, B5, B6, C1, C2, C3, D1, D2, D3, D4]
  agents: [DV1, DV2, DV3, QA1, QA2, DE1, ST1]

design:
  # UI/UX designer draws a mockup of each screen state (docs/ui/: HTML pages, PNGs, index.html gallery
  # shown at the UI gate, G4). PNGs need Chrome or Chromium; without it only the HTML pages are written.
  mockups: true
  mockup_states: [success, loading, error, empty]   # kinds of states to draw, matched to each screen's spec
  max_states_per_screen: 4
  viewport: [390, 844]

build:
  # Test Writer writes acceptance tests per milestone before the build; they must fail first, then
  # they are locked (tests.lock) and builders may not change them.
  acceptance_tests: true
  # Backend (+infra) and frontend lanes build at the same time; app tasks work against the contract.
  parallel: true
  # Every QA round: the Integrator's checks (combined build and tests, contract copies, locked tests, secrets)
  # and the profile's scans, with raw results in reports/; then, if clean, the Code Reviewer.
  verify: true
  review: true
  milestones: []
  sandbox: local
  check_fix_attempts: 2
  agent_timeout_s: 3600

gates:
  prd: true          # G1 spec approval (customer, through the Product Owner)
  architecture: true # G2 design approval (human architect)
  estimate: true       # G3 estimate approval (customer, through the Product Owner)
  ui: true             # G4 UI design approval (customer, through the Product Owner)
  merge: true         # G5 merge approval (developer of record, with a risk note)
  release: false      # G6 UAT sign-off (customer, through the Product Owner)
  production: true   # G7 go-live approval (named approver; the run then ends ready to deploy)

# Risk tier L | M | H (the intake can set it per run). Tier L may waive the design gate
# (gates.architecture_waiver_at_tier_l) and is required for gate_mode auto.
risk_tier: L
# Demo/test pipeline: allows gate_mode auto (gates approved without a person, recorded as "auto").
demo: true
# console: ask on the terminal. async: stop and wait for `uv run approve <run_id> <G> --as "Name"`,
# then `uv run resume`. auto: demo pipelines at tier L only. Override with SDLC_GATE_MODE.
gate_mode: auto

limits:
  gate_rejections: 3
  qa_fix_rounds: 2

