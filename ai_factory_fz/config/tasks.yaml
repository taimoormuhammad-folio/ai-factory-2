# Task prompts per phase. {placeholders} are filled by the flow before the task runs.
# Each task's structured output model is set in code (src/agentic_sdlc/crews/).

write_prd:
  agent: business_analyst
  description: |
    Write the specification (spec.md) from the Product Owner's intent. You never invent business
    rules or choose technology: anything the intent does not settle goes into open_questions for the
    Product Owner, who answers them at the spec gate.

    Intent from the Product Owner:
    {intent}

    Target stack (for context only; do not design the architecture):
    {stack}

    Product Owner feedback on the previous draft, including answers to open questions (address all of
    it; empty if first draft):
    {revision_notes}

    Scope for this run:
    {scope_rules}

    Rules:
    - Story ids are US-001, US-002, ... Every story has at least two testable acceptance criteria in
      Given/When/Then form. Every criterion has a stable id unique across the spec: AC-01, AC-02, ...
      (tests and acceptance evidence refer to these ids, so do not renumber them in revisions).
    - Mark priority as must, should or could. Keep the first release focused.
    - List edge cases, non-functional requirements (performance, security, privacy, accessibility,
      platforms), an explicit out-of-scope list, assumptions and open questions.
  expected_output: A complete spec with stories, acceptance criteria ids, edge cases and open questions.

design_wbs:
  agent: architect
  description: |
    Break your design into the work breakdown structure (WBS): work packages (WP-01...)
    of small tasks (WI-001...). Builders work task by task and may write only the paths a task owns.

    Spec:
    {prd}

    The solution (your design):
    {solution}

    Target stack: {stack}

    Repository layout (fixed by the build tooling):
    {layout}

    Component folders (a task owns paths only inside its component's folder) and the commands its
    verify command may start with:
    {workdirs}

    Reviewer feedback on the previous version (address all of it, empty if first draft):
    {revision_notes}

    Rules:
    - Each task: component, the files or folders it owns (globs like server/src/cart/**), a verify
      command that proves it works (e.g. npm test -- cart, flutter test test/cart), the stories and
      the acceptance criteria (AC-..) it makes pass, and its dependencies.
    - Ownership: frontend, backend and infra tasks never own the same paths (they are built in
      parallel). A task owns every file it changes, including shared wiring it must edit (e.g. the
      backend's app module registration, the app's router); dependency manifests are always allowed.
      Keep tasks small (about a day of work). Components without commands (infra) verify with "-".
    - Entry points: the files that start a component are listed below. The component's FIRST task (its
      project setup) owns them, so that after every milestone the app starts and its tests can run end to
      end; later tasks add their routes or modules by editing those files (they list them in owns too).
      {entry_points}
    - Coverage: every must-have acceptance criterion has a task; every API operation is implemented by
      a backend task; every data model is covered. App tasks that call an operation depend on the
      backend task that implements it. Project setup and infrastructure (Dockerfile, compose, CI) are
      tasks too. No cycles.
  expected_output: Work packages and tasks with owned paths, verify commands, criteria and dependencies.

plan_delivery:
  agent: project_manager
  description: |
    Sequence the Architect's WBS into a delivery plan and estimate every task. You may not add, drop
    or change tasks; if the WBS looks wrong, say so in risks (scope changes go back to the Architect).

    Spec:
    {prd}

    WBS (from the Architect):
    {wbs}

    Scope for this run:
    {scope_rules}

    Reviewer feedback on the previous plan (address all of it, empty if first draft):
    {revision_notes}

    Rules:
    - Milestones M1, M2... in delivery order, each ending in a testable slice; every task in exactly
      one milestone; a task never waits for a task in a later milestone.
    - Every milestone must END IN SOMETHING THAT STARTS: when a milestone has tasks of a component, a
      task of that milestone or an earlier one must own that component's entry-point files:
      {entry_points}
    - Estimate every task in points (1-8) with complexity, risk and confidence (low/medium/high) and a
      one-line rationale naming what drives the size. Be honest about risk: new infrastructure,
      payments, auth and concurrency are higher risk.
    - List delivery risks and a short schedule note.
  expected_output: Milestones over the WBS tasks, an estimate per task, risks and a schedule note.

design_architecture:
  agent: architect
  description: |
    Design the system for this approved spec. (You break it into the WBS next, so make modules,
    operations and data models explicit.)

    Spec:
    {prd}

    Target stack: {stack}
    Core domain entities to consider: {domain_entities}

    Repository layout (fixed by the build tooling, which creates these folders and runs the coding
    agents in them; use exactly these paths and add no other top-level folders such as apps/ or packages/):
    {layout}

    Reviewer feedback on the previous draft (address all of it, empty if first draft):
    {revision_notes}

    Scope for this run (also limits the API: only endpoints the stories need):
    {scope_rules}

    Deliver:
    0. At least two design options (including the simplest that meets the spec, marked simplest) with
       pros and cons, and the recommended one (recommended_option); the rest of the design is that option.
    1. Components and their responsibilities.
    2. Backend modules: each with its entities and the endpoints it owns.
    3. Mobile app features: screens and state management per feature.
    4. A complete OpenAPI 3.1 document in YAML (openapi_yaml) covering every
       endpoint the must-have stories need, with request/response schemas,
       bearer auth, pagination and a shared error schema. Every operation has
       an operationId (used to generate the mobile API client).
    5. {data_layer}
    6. Security design and at least three ADRs for the key decisions.
  expected_output: The architecture document, OpenAPI YAML and (when the stack has a database) Prisma schema.

design_ui:
  agent: ui_ux_designer
  description: |
    Create the design system and screen specifications for the mobile app.

    PRD:
    {prd}

    App features and screens from the architecture:
    {app_features}

    Reviewer feedback on the previous design (address all of it, empty if first draft):
    {revision_notes}

    Scope for this run:
    {scope_rules}

    Rules:
    - Colors as hex values; include light and dark theme colors.
    - Every screen has an id (SCR-01...), a go_router path, the components it
      uses, its loading/empty/error states, and the user stories it serves.
    - Every must-have user story is served by at least one screen.
    - Minimum touch target 48dp; text contrast at least WCAG AA.
  expected_output: A design system with screen specs and navigation.

design_mockups:
  agent: ui_ux_designer
  description: |
    Draw mockups of screen {screen_id} of the mobile app, one per state listed below. They are shown to
    the reviewer at the architecture gate and given to the frontend developer, so make them look like the
    real screen: realistic sample content (item names, SKUs, prices, quantities, addresses), the real
    labels and buttons, and the layout a phone user would see.

    Product:
    {product}

    Screen:
    {screen}

    User stories this screen serves, with their acceptance criteria (the mockups must follow them, e.g.
    what may and may not be shown; sample content must fit this product and its customers):
    {stories}

    States to draw (use exactly these names in "state"):
    {states}

    Mockup kit (the page around your markup, a phone screen, is provided):
    {kit}

    Accessibility rules from the design system: {accessibility}

    Reviewer feedback on the previous design (address all of it, empty if first draft):
    {revision_notes}

    Rules:
    - For each state, return body markup only: no html, head, body, style, script, link, iframe or img tags.
    - Style only with the kit classes, the typography classes and inline styles that use var(--token)
      colors, var(--sp-N) spacing and var(--r-N) radii. No hex, rgb() or hsl() colors and no URLs.
    - Images are .img boxes; icons are .icon placeholders with a short name.
    - Loading states use .skeleton bars shaped like the content; error states show the message and the
      Retry action; empty states explain what to do next.
    - Keep each state under about 60 lines of markup.
  expected_output: The screen id and one mockup (state name and body markup) per state listed.

# ---------- build phase (M3). {tooling} is filled in by the worker (Claude Code or CrewAI tools). ----------

implement_work_item:
  agent: backend_developer   # overridden per component (see profile components)
  description: |
    Implement work item {item_id} ({component}): {item_title}

    What it covers:
    {item_description}

    Milestone: {milestone}

    User stories and acceptance criteria this item serves:
    {stories}

    Already built (do not redo; build on it):
    {done_items}

    How to work:
    {tooling}

    Source of truth, in {docs_dir} (read what you need, do not edit):
    - api-contract.yaml: the API contract. Endpoints, request/response shapes and status codes must match it exactly.
    - design.md: modules, data model notes, security design; adr-*.md: the decisions.
    - spec.md: requirements and acceptance criteria (AC-..). wbs.md: your task's owned paths and verify command.
    - ui-design.md and ui/: screens, design tokens and the approved screen prototypes (mobile work).
    - The project conventions in your instructions.

    Locked acceptance tests (written before the build; you cannot change them, and they define the
    names they need: the app's root widget and package imports, widget Keys, helper hooks). Read the
    ones for your component FIRST and build exactly those names so they compile and pass when the
    milestone is finished. Files:
    {acceptance_files}

    Rules:
    - Implement only this work item, completely. No placeholders or TODOs for the core behaviour.
    - Add focused tests for the behaviour you add.
    - These checks must pass when you finish: {checks}. Run them if you can; fix what fails.
    - Never put secrets in code; read configuration from environment variables.
    - If the item cannot be done (e.g. it needs an external account or a decision), set blocked
      to true and explain in blocked_reason instead of faking it.

    Problems to fix from a previous attempt:
    {problems}
  expected_output: A report of what you changed and whether the checks pass.

fix_work_item:
  agent: backend_developer
  description: |
    Fix work item {item_id} ({component}): {item_title}

    Problems to fix:
    {problems}

    Context: {item_description}
    Milestone: {milestone}

    User stories and acceptance criteria:
    {stories}

    How to work:
    {tooling}

    The API contract and design documents are in {docs_dir} (read-only).
    Locked acceptance tests (read-only; they define the names and behaviour to build): {acceptance_files}
    Fix the root cause with the smallest correct change, keep existing tests passing, and make
    sure these checks pass: {checks}.
  expected_output: A report of what you changed and whether the checks pass.

qa_milestone:
  agent: qa_engineer
  description: |
    Verify milestone {milestone}

    Built work items:
    {items}

    Not built (blocked or failed; do not report bugs for these):
    {not_built}

    Acceptance criteria to verify:
    {stories}

    How to work:
    {tooling}

    Documents in {docs_dir}: api-contract.yaml (API contract), design.md, spec.md, ui-design.md, wbs.md, plan.md.

    Do this:
    1. For each acceptance criterion above that the built items cover, find the code and the tests
       that prove it (the locked acceptance tests are the definition of done). You never edit files:
       a criterion without a passing test is a bug.
    2. Check that implemented endpoints match api-contract.yaml (paths, methods, status codes, shapes).
    3. Look for security problems: auth checks, input validation, secrets in code.
    Report each real defect as a bug with the work item it belongs to. Severity: blocker (breaks
    the milestone goal or security), major (an acceptance criterion is not met), minor (other).
    Set milestone_id to {milestone_id}. passed is true only when there are no blocker or major bugs.

    Locked acceptance tests (written before the build; a failing one means its criterion is not met,
    report it as a major bug for the task that serves the criterion):
    {acceptance}

    Integration and scan results (deterministic; report files are listed; do not repeat their bugs, but
    never say "passed" for anything they show failing):
    {verification}
  expected_output: A QA report.

review_milestone:
  agent: code_reviewer
  description: |
    Review the code of milestone {milestone} independently. You did not write it and you never edit it.

    What changed (git diff stat) and where to read it: {diff_stat}
    Read the changed files with your tools. Work items and their owned paths:
    {items}

    Spec and acceptance criteria this milestone serves:
    {stories}

    Documents in {docs_dir}: spec.md, design.md, api-contract.yaml, adr-*.md, ui-design.md.
    QA and scan summary for this milestone: {verification}

    Review through all five lenses and set lenses_covered to the ones you did:
    - spec: does the code do what the acceptance criteria say, including the edge cases?
    - security: authorization, input validation, injection, secrets, unsafe defaults, data exposure.
    - design: does it follow the design, the ADRs and the API contract exactly (no drift)?
    - quality: correctness, error handling, duplication, tests that prove little.
    - operability: configuration, logging without personal data, failure behaviour, migrations.
    For each finding give the work item, file and line, severity (blocker: unsafe or wrong in a way
    that must not merge; major: a criterion or the design is not met; minor: worth fixing later),
    your confidence (low/medium/high), what is wrong and what would fix it. Only blocker/major
    findings you are at least moderately sure of send work back to the builders: do not pad the list.
    {revision_notes}
  expected_output: A review report with findings per lens.

write_acceptance_tests:
  agent: test_writer
  description: |
    Write the acceptance tests for milestone {milestone}, component {component}, BEFORE the code exists.

    Acceptance criteria to prove (one or more tests each; put the criterion id in the test name):
    {criteria}

    How to work:
    {tooling}

    Read the API contract ({docs_dir}/api-contract.yaml), the spec ({docs_dir}/spec.md) and, for app
    tests, the UI design ({docs_dir}/ui-design.md: screens, states and test keys).

    Rules:
    - Write the tests only in {folder}/ (one file per criterion is fine). {runner_note}
    - Test behaviour through the public surface: HTTP calls against the app module for the backend
      (the SuiteCommerce or other external services faked at their HTTP boundary), widgets found by
      Key for the app. Use the contract's exact paths, fields and status codes.
    - Never write application code, stubs or fakes of the code under test: the tests must fail now,
      because the feature is not built yet. The pipeline runs `{command}` and requires it to fail.
    - The builders cannot change these tests, and they read them first. So put everything the tests
      need from the app in ONE file, {folder}/support/contract.md (or contract.dart / contract.ts for
      constants): the root widget or module and where it is imported from, the package name, every
      widget Key or selector, the environment variables, the HTTP base-URL hook, and any provider
      override. Prefer names the UI design (ui-design.md) already uses.
    - If a criterion cannot be tested as written, set blocked and say why instead of guessing.
  expected_output: The tests written, each with its criterion id, file and test name.

# ---------- release phase (M4) ----------

deploy_staging:
  agent: deployment_engineer
  description: |
    Prepare this system to run on a staging environment.

    Built so far:
    {built}

    Not built (ignore these):
    {not_built}

    How to work:
    {tooling}

    Documents (read-only) are in {docs_dir}; the API code is in '{api_dir}'.

    The build phase may already have created some of these as an infra work item: check what
    exists first, keep what works, and only fix or add what is missing or wrong. Make sure of:
    1. {api_dir}/Dockerfile: a small multi-stage production image for the API. {start_rule}
       Use the same runtime major version as the build toolchain ({toolchain_image}), e.g. its
       -slim variant: the lockfile was produced with that toolchain.
    2. {compose_file}: the API{compose_services} for staging. Publish the API on host port
       $STAGING_PORT (default {port}); build the API from {api_dir}; read settings from {env_file}.
    3. {env_file}: every environment variable the API needs, with SAFE TEST VALUES ONLY (no real
       keys: use placeholders such as sk_test_placeholder).{env_rule} Add a comment at the top
       saying these are test values.
    4. .github/workflows/ci.yml: install, lint, build and test the API on every push and pull request.
    5. infra/README.md: how to run staging, and which variables production needs.
    Also make sure the API serves GET {health_path} (200 when up) and its OpenAPI document as JSON
    at {openapi_json_path} (for example with @nestjs/swagger); add them if missing, with tests.
    Never write real secrets anywhere.
    {staging_notes}
  expected_output: A report of the files you created and anything a human must provide.

write_smoke_tests:
  agent: smoke_tester
  description: |
    Write a smoke test suite that checks the critical user journeys against a RUNNING API.

    Built so far (test only these):
    {built}

    How to work:
    {tooling}

    The suite runs with `{smoke_command}` from the '{api_dir}' directory, with the environment
    variable SMOKE_BASE_URL set to the API's full base URL, INCLUDING the API prefix (for example
    {api_base_example}). Build request URLs as SMOKE_BASE_URL + the contract path (e.g. + "/products").
    - Add the script to package.json if it does not exist; keep smoke tests separate from unit
      tests (their own folder and config) so `npm test` does not run them.
    - Use plain HTTP requests against SMOKE_BASE_URL; do not import application code.
    - Cover only journeys the built items support, end to end (e.g. health, sign up, sign in,
      browse, add to cart), with unique test data per run (e.g. a timestamped email).
    - The API contract is {docs_dir}/api-contract.yaml; request/response shapes must follow it.
    - Keep it short and reliable: a handful of journeys, clear failure messages.
  expected_output: A report of the smoke suite you wrote.

integration_review:
  agent: integration_pass
  description: |
    The system is running on staging at {base_url}. Check that the parts work together.

    Built so far:
    {built}

    Contract check (API served vs {docs_dir}/api-contract.yaml, built scope only):
    {contract_issues}

    Recent staging logs:
    {staging_logs}

    How to work:
    {tooling}

    Check: configuration and environment variables ({env_file}, config validation), the API prefix,
    {data_check}CORS/security headers, error format, and that implemented endpoints match
    the contract (see the contract check). Fix small glue problems yourself (configuration, wiring,
    missing registration of a module) and say so in criteria_checked. Report anything else as a
    bug with the work item it belongs to (use RELEASE if unclear). Severity: blocker if the system
    cannot serve its built journeys, major for contract mismatches, minor otherwise.
    Set milestone_id to "integration". passed is true only with no blocker or major bugs.
  expected_output: An integration report.

write_device_tests:
  agent: smoke_tester
  description: |
    Write on-device journey tests for the mobile app, to run on an Android emulator against the
    running staging API.

    Built so far (test only these):
    {built}

    How to work:
    {tooling}

    The app is in '{app_dir}'. Put the tests in '{app_dir}/{test_dir}/' using Flutter's
    integration_test package (add it as a dev dependency from the Flutter SDK if missing).
    They run with: {test_command}
    so the app talks to the real API at {device_api_base} (the emulator reaches this machine at
    {host_alias}). Do not mock the network.
    - Drive the real app from its entry point, like a user: open the product list, open a product,
      add it to the cart, open the cart, change a quantity and check the total, for the journeys
      the built items support.
    - Wait for network data with pumpAndSettle or explicit waits with timeouts; keep each test
      independent of the others and of existing cart state.
    - A handful of reliable journeys beats many fragile ones. Clear failure messages.
    - Do not change application behaviour. If the app cannot reach {device_api_base} from the
      device (e.g. cleartext HTTP blocked), leave the test as is: that failure goes to the
      frontend developer.
  expected_output: A report of the on-device tests you wrote.


