# App-type profile: Flutter mobile e-commerce app with a NestJS + PostgreSQL backend.
# To support a new app type, copy this folder and change it. The core stays the same.

name: flutter_nestjs_ecommerce
description: Flutter e-commerce mobile app with a NestJS + Prisma + PostgreSQL REST API.

stack:
  mobile: Flutter 3.x (Dart), Riverpod, go_router, dio, freezed/json_serializable, API client generated from OpenAPI (dart-dio)
  backend: NestJS (TypeScript), Prisma ORM, PostgreSQL 16, JWT auth, @nestjs/swagger
  payments: Stripe (test mode)
  testing: flutter_test + integration_test; Jest + Supertest
  delivery: Docker, docker-compose (staging), GitHub Actions; Android first

domain_entities: [User, Address, Category, Product, ProductVariant, Cart, CartItem, Order, OrderItem, Payment]

# Extra context appended to an agent's backstory (paths relative to this folder).
agent_context:
  business_analyst: [knowledge/ecommerce_domain.md]
  project_manager: [knowledge/ecommerce_domain.md]
  architect:
    - knowledge/ecommerce_domain.md
    - knowledge/nest_conventions.md
    - knowledge/flutter_conventions.md
  ui_ux_designer: [knowledge/flutter_conventions.md]
  backend_developer: [knowledge/nest_conventions.md]
  frontend_developer: [knowledge/flutter_conventions.md]
  qa_engineer: [knowledge/nest_conventions.md, knowledge/flutter_conventions.md]

# Field overrides on top of config/agents.yaml, e.g.:
# agent_overrides:
#   architect:
#     goal: ...
agent_overrides: {}

# What gets built, by which agent, where, and how it is verified.
# checks run after every work item; an item is only done when they pass.
components:
  backend:
    agent: backend_developer
    workdir: server
    runtime: node
    checks: [npm run build, npm test]
    # Locked acceptance tests (Test Writer, before the build); run at each milestone.
    acceptance:
      dir: server/test/acceptance
      command: npm run test:acceptance
      note: >
        Add an npm script "test:acceptance" to server/package.json that runs only this folder with the
        project's test runner. The pipeline runs the suite against a real, empty PostgreSQL (DATABASE_URL is
        set, the schema is created from prisma/schema.prisma with `prisma db push`) that exists only while the
        suite runs, so you cannot run it yourself and must not mock the database: create the data each test needs
        through PrismaClient and drive the app through HTTP. The tests fail until the feature is built, and
        only because the feature is missing (an unreachable database or a broken test setup is rejected).
      database:
        prepare:
          - npx prisma db push --skip-generate --accept-data-loss
    scaffold:
      # Keep the @nestjs/* majors in step with the CLI major.
      - run: npx -y @nestjs/cli@12 new server --package-manager npm --skip-git --strict
        creates: server/package.json
      # Pin majors: an unpinned install follows npm "latest", which can be a pre-release.
      # Prisma 6 matches the schema style the Architect writes (prisma-client-js, url in datasource).
      - workdir: server
        run: npm install @nestjs/config@^12 @nestjs/swagger@^12 @prisma/client@^6 class-validator class-transformer
      - workdir: server
        run: npm install --save-dev prisma@^6
      - copy_from: docs/schema.prisma
        copy_to: server/prisma/schema.prisma
      - copy_from: docs/api-contract.yaml
        copy_to: server/openapi.yaml
      - workdir: server
        run: npx prisma generate
  frontend:
    agent: frontend_developer
    workdir: app
    runtime: flutter
    # Analyze only the app's own code: the locked acceptance tests (acceptance_test/) import code that later tasks write.
    checks: [flutter analyze lib test, flutter test]
    acceptance:
      # Outside test/: the task checks (`flutter test`) must not run these locked tests, which fail until the
      # milestone's screens exist. They run at the end of the milestone, before QA. Not named integration_test:
      # Flutter runs that folder on a device, and there is none.
      dir: app/acceptance_test
      command: flutter test acceptance_test
      note: >
        Widget tests (flutter_test, testWidgets) found by Key, run on the Dart VM; no device is needed. Put shared
        helpers in a support/ folder next to the tests. Keep this folder out of test/ so the normal checks do not
        run it, and do not move it under integration_test/ (that needs a device).
    scaffold:
      - run: flutter create --org com.shopease --project-name shopease_app --platforms android,ios app
        creates: app/pubspec.yaml
      - copy_from: docs/api-contract.yaml
        copy_to: app/openapi.yaml
      - runtime: openapi
        run: generate -i docs/api-contract.yaml -g dart-dio -o app/packages/api_client --additional-properties=pubName=api_client
        creates: app/packages/api_client/pubspec.yaml
      - workdir: app
        run: flutter pub get
  infra:
    agent: deployment_engineer
    workdir: .
    runtime: null
    checks: []
  shared:
    agent: backend_developer
    workdir: .
    runtime: null
    checks: []

# What the Architect's output is checked against (see src/agentic_sdlc/guardrails/architecture.py).
guardrails:
  required_stack: [flutter, nestjs, prisma, postgresql]   # must appear in the components
  forbidden_stack: [react, react native, angular, vue, next.js, express, django, rails, laravel, spring,
                    mongodb, mysql, firestore, firebase auth, cloud functions, supabase, graphql,
                    kotlin, swift, xamarin, ionic]    # backends/clients outside the stack (SDKs like analytics are fine)
  platform: flutter mobile (Android and iOS)
  platform_technology: flutter
  forbidden_platforms: [web app, web client, website, desktop, electron, pwa]
  money_fields: [price, amount, total, subtotal, cost, fee, tax, discount]
  min_adrs: 3
  # Agent guardrails (DV3: copies of the approved contract must not drift)
  contract_copies:
    docs/api-contract.yaml: [server/openapi.yaml, apps/api/openapi.yaml, app/openapi.yaml]
    docs/schema.prisma: [server/prisma/schema.prisma, apps/api/prisma/schema.prisma]
  scope_also_allowed: []        # extra paths any coding item may change (e.g. [.github/])
  secret_scan_ignore: []        # paths skipped by the secret scan

# Release phase: how staging runs and is checked.
release:
  api_component: backend
  api_prefix: /api/v1
  health_path: /api/v1/health
  openapi_json_path: /api/docs-json      # @nestjs/swagger JSON (the Deployment engineer ensures it is served)
  compose_file: infra/docker-compose.staging.yml
  env_file: infra/staging.env
  local_prepare: [npm run build, npx prisma migrate deploy]
  local_start: node dist/main.js
  smoke_command: npm run test:smoke
  package_commands: [npm ci, npm run build]

# Running the app on an Android emulator (release phase device tests, and `uv run showcase`).
device:
  app_component: frontend
  app_id: com.shopease.shopease_app          # from flutter create --org com.shopease --project-name shopease_app
  system_image: system-images;android-35;google_apis;x86_64
  avd_name: sdlc_phone
  device_profile: pixel_7
  build_command: flutter build apk --debug --dart-define=API_BASE_URL={api_base}
  apk_path: build/app/outputs/flutter-apk/app-debug.apk
  test_command: flutter test integration_test -d {serial} --dart-define=API_BASE_URL={api_base}
  asset_env:
    PUBLIC_ASSET_BASE_URL: http://{host}:{port}/assets

# Toolchains. docker mode uses `image`; local mode needs `local_binary` on PATH.
sandbox:
  runtimes:
    node:
      # Node 24 ships npm 11; npm 10 (Node 22) crashes resolving the NestJS 12 dependency tree.
      image: node:24-bookworm
      local_binary: npm
    flutter:
      image: ghcr.io/cirruslabs/flutter:stable
      local_binary: flutter
      run_as_root: true            # the SDK writes to its root-owned cache
      env:
        PUB_CACHE: /workspace/.pub-cache   # keep downloaded packages between commands
        GRADLE_USER_HOME: /workspace/.gradle   # keep the Android build cache between commands
        ANDROID_USER_HOME: /workspace/.android # one debug signing key per run (reinstalls keep working)
    openapi:
      image: openapitools/openapi-generator-cli:v7.10.0
      local_binary: java
      local_prefix: npx -y @openapitools/openapi-generator-cli
  # Non-secret environment for every command (Prisma needs a URL even to generate/validate).
  env:
    CI: "true"   # non-interactive test runners
    DATABASE_URL: postgresql://shopease:shopease@localhost:5432/shopease?schema=public
  # Commands agents may run (prefix match, one command at a time, no shell operators).
  allowed_commands:
    flutter:
      - flutter pub get
      - flutter pub add
      - flutter analyze
      - flutter test
      - dart run build_runner build
      - dart format
    node:
      - npm install
      - npm ci
      - npm run build
      - npm run lint
      - npm test
      - npm run test
      - npm run test:acceptance
      - npx prisma generate
      - npx prisma validate
      - npx prisma format
      - npx prisma migrate diff
      - npx tsc --noEmit
