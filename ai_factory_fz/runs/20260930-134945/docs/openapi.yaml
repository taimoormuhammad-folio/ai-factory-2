openapi: 3.1.0
info:
  title: Lighting Shop API
  version: 0.1.0
  description: |
    Contract for the read-only lighting catalog and health check.
    NOT implemented in milestone M1: the M1 app uses a bundled mock catalog whose JSON
    matches the ProductDetail schema below. All prices are integer minor units (pence)
    with an ISO 4217 currency code and include 20% VAT. Floats are never used for money.
    stockStatus is derived from stockQuantity with a global low-stock threshold of 5:
    0 = out_of_stock, 1-5 = low_stock, greater than 5 = in_stock.
servers:
  - url: http://localhost:3000
    description: Local development
  - url: http://10.0.2.2:3000
    description: Local staging from the Android emulator (debug builds only)
tags:
  - name: health
    description: Infrastructure
  - name: catalog
    description: Public product catalog
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness and database reachability
      security: []
      responses:
        '200':
          description: Service is up and the database is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: List active products
      description: Returns active products ordered by name ascending, then id ascending.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{productId}:
    get:
      tags: [catalog]
      operationId: getProduct
      summary: Get one active product with lighting specifications
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          description: Product UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (15 min). Not required by any operation in this version; declared for later protected modules.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 400
            error: Bad Request
            message: pageSize must not be greater than 100
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 404
            error: Not Found
            message: Product not found
    ServiceUnavailable:
      description: Database unreachable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 503
            error: Service Unavailable
            message: Database unreachable
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 500
            error: Internal Server Error
            message: Unexpected error
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [statusCode, error, message]
      properties:
        statusCode:
          type: integer
          description: HTTP status code
        error:
          type: string
          description: HTTP reason phrase
        message:
          type: string
          description: Human-readable message; multiple validation errors are joined with '; '
    Health:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [up]
    StockStatus:
      type: string
      enum: [in_stock, low_stock, out_of_stock]
      description: Derived from stockQuantity; 0 = out_of_stock, 1-5 = low_stock, greater than 5 = in_stock
    Category:
      type: object
      additionalProperties: false
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          example: pendant-lights
        name:
          type: string
          minLength: 1
          example: Pendant lights
    ProductSummary:
      type: object
      additionalProperties: false
      required: [id, sku, name, brand, category, priceMinor, salePriceMinor, currency, stockQuantity, stockStatus, imageUrl, imageAlt]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          minLength: 1
          example: LUX-PEN-001
        name:
          type: string
          minLength: 1
          example: Aurora Brass Dome Pendant
        brand:
          type: string
          minLength: 1
          example: Luxora
        category:
          $ref: '#/components/schemas/Category'
        priceMinor:
          type: integer
          minimum: 1
          description: Regular price in minor units (pence), VAT inclusive
          example: 8999
        salePriceMinor:
          type: [integer, 'null']
          minimum: 1
          description: Sale price in minor units, VAT inclusive; null when not on sale; always lower than priceMinor
          example: 6999
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 currency code
          example: GBP
        stockQuantity:
          type: integer
          minimum: 0
          example: 4
        stockStatus:
          $ref: '#/components/schemas/StockStatus'
        imageUrl:
          type: string
          format: uri
          example: https://cdn.example.com/products/lux-pen-001.webp
        imageAlt:
          type: string
          minLength: 1
          description: Semantic label for the product image
          example: Brass dome pendant light hanging from a black cord
    ProductDetail:
      type: object
      additionalProperties: false
      required: [id, sku, name, brand, category, priceMinor, salePriceMinor, currency, stockQuantity, stockStatus, imageUrl, imageAlt, description, specifications]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        brand:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/Category'
        priceMinor:
          type: integer
          minimum: 1
          description: Regular price in minor units (pence), VAT inclusive
        salePriceMinor:
          type: [integer, 'null']
          minimum: 1
          description: Sale price in minor units, VAT inclusive; null when not on sale; always lower than priceMinor
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        stockQuantity:
          type: integer
          minimum: 0
        stockStatus:
          $ref: '#/components/schemas/StockStatus'
        imageUrl:
          type: string
          format: uri
        imageAlt:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        specifications:
          $ref: '#/components/schemas/LightingSpecifications'
    LightingSpecifications:
      type: object
      additionalProperties: false
      description: All fields optional; fields not applicable to the product are omitted and must not be displayed.
      properties:
        wattageW:
          type: integer
          minimum: 0
          description: Power in watts
          example: 9
        lumens:
          type: integer
          minimum: 0
          example: 806
        colorTemperatureK:
          type: integer
          minimum: 1000
          maximum: 10000
          example: 2700
        voltageV:
          type: integer
          minimum: 1
          example: 240
        lightType:
          type: string
          example: LED
        dimmable:
          type: boolean
        material:
          type: string
          example: Brass
        finish:
          type: string
          example: Brushed brass
        dimensionsMm:
          $ref: '#/components/schemas/Dimensions'
        weightG:
          type: integer
          minimum: 0
          example: 1200
        ipRating:
          type: string
          pattern: '^IP[0-9X][0-9X]$'
          example: IP44
        bulbType:
          type: string
          example: E27
        bulbIncluded:
          type: boolean
    Dimensions:
      type: object
      additionalProperties: false
      description: Dimensions in millimetres; any field may be omitted
      properties:
        widthMm:
          type: integer
          minimum: 1
        heightMm:
          type: integer
          minimum: 1
        depthMm:
          type: integer
          minimum: 1
        diameterMm:
          type: integer
          minimum: 1
    ProductPage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        total:
          type: integer
          minimum: 0
          description: Total number of matching products across all pages
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
