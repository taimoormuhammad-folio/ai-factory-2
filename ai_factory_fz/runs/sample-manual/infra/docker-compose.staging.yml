# SAMPLE FILE: written by hand to try the DeepEval tests. NOT output of the pipeline.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shopease
      POSTGRES_PASSWORD: staging_password_placeholder
      POSTGRES_DB: shopease
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopease"]
      interval: 5s
      retries: 10
  api:
    build: ../server
    env_file: staging.env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  dbdata:
