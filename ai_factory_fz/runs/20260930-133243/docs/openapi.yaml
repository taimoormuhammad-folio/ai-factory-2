openapi: 3.1.0
info:
  title: ShopEasy API
  version: 0.1.0
  description: >-
    ShopEasy contract for milestone M1 (Speed Demo). The M1 mobile app uses a
    local mock catalogue and makes no network calls, so 0 business operations
    are defined. This document contains the infrastructure health check (which
    does not count toward the API operation limit) and the shared schemas that
    the app's local domain models mirror (Money, ProductSummary, Product,
    ProductVariant, StockStatus, ProductPage, Error, pagination parameters and
    the bearer auth scheme) so a future catalog API can be added without
    changing app models. All prices are integer minor units with an ISO 4217
    currency code; never floats. Prices are VAT-inclusive.
  contact:
    name: ShopEasy Engineering
servers:
  - url: http://10.0.2.2:3000
    description: Local staging reached from the Android emulator (debug builds only)
  - url: https://api.staging.shopeasy.example
    description: Staging
tags:
  - name: health
    description: Infrastructure checks
paths:
  /api/v1/health:
    get:
      tags:
        - health
      operationId: getHealth
      summary: Service liveness and database reachability
      description: Returns 200 when the service is running and the database is reachable, otherwise 503. Public endpoint, no authentication.
      security: []
      responses:
        '200':
          description: Service is up and the database is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                database: up
        '503':
          description: Database is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 503
                error: Service Unavailable
                message: Database is unreachable
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (15 minutes). Not used by any M1 operation; reserved for future authenticated endpoints.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number for list endpoints.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Number of items per page for list endpoints.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
      properties:
        status:
          type: string
          enum:
            - ok
        database:
          type: string
          enum:
            - up
    Error:
      type: object
      additionalProperties: false
      description: Shared error body returned by every non-2xx response.
      required:
        - statusCode
        - error
        - message
      properties:
        statusCode:
          type: integer
          minimum: 400
          maximum: 599
          examples:
            - 404
        error:
          type: string
          description: HTTP reason phrase.
          examples:
            - Not Found
        message:
          type: string
          description: Human-readable description. Multiple validation messages are joined with '; '.
          examples:
            - Product not found
    Money:
      type: object
      additionalProperties: false
      description: Amount in integer minor units (pence for GBP), VAT-inclusive. Never a float.
      required:
        - amountMinor
        - currency
      properties:
        amountMinor:
          type: integer
          minimum: 0
          examples:
            - 1999
        currency:
          type: string
          description: ISO 4217 currency code. Only GBP is supported.
          enum:
            - GBP
    StockStatus:
      type: string
      description: Derived from stock. 0 = out_of_stock, 1-5 = low_stock, more than 5 = in_stock.
      enum:
        - in_stock
        - low_stock
        - out_of_stock
    ProductVariant:
      type: object
      additionalProperties: false
      required:
        - id
        - sku
        - label
        - stock
        - stockStatus
      properties:
        id:
          type: string
          examples:
            - p-001-m
        sku:
          type: string
          examples:
            - TEE-CLASSIC-M
        label:
          type: string
          description: Variant label shown to the shopper, for example a size.
          examples:
            - M
        stock:
          type: integer
          minimum: 0
          examples:
            - 4
        stockStatus:
          $ref: '#/components/schemas/StockStatus'
    ProductSummary:
      type: object
      additionalProperties: false
      description: Product as shown in the product list.
      required:
        - id
        - name
        - price
        - imageUrl
      properties:
        id:
          type: string
          examples:
            - p-001
        name:
          type: string
          maxLength: 200
          examples:
            - Classic Cotton T-Shirt
        price:
          $ref: '#/components/schemas/Money'
        imageUrl:
          type:
            - string
            - 'null'
          description: Mobile-sized product image; null means show a placeholder.
    Product:
      type: object
      additionalProperties: false
      description: Full product as shown on the product detail screen.
      required:
        - id
        - name
        - description
        - price
        - imageUrl
        - variants
      properties:
        id:
          type: string
          examples:
            - p-001
        name:
          type: string
          maxLength: 200
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        imageUrl:
          type:
            - string
            - 'null'
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductVariant'
    ProductPage:
      type: object
      additionalProperties: false
      description: Paginated list of products (shape for the future catalog list endpoint).
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
