openapi: 3.1.0
info:
  title: Simple Shop API
  version: 0.1.0
  description: >-
    Contract for the Simple Shop catalogue. In release M1 (speed demo) this API is NOT implemented;
    the Flutter app uses a bundled mock catalogue whose shape mirrors these schemas exactly.
    Prices are integer minor units (pence) with ISO 4217 currency code, VAT-inclusive.
servers:
  - url: http://10.0.2.2:3000/api/v1
    description: Local staging from the Android emulator (debug builds only)
  - url: https://api.simpleshop.example/api/v1
    description: Production (future)
tags:
  - name: catalog
    description: Public product browsing
  - name: health
    description: Infrastructure health check
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Health check (200 when the database is reachable)
      security: []
      responses:
        '200':
          description: Service and database are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: List active products (paginated)
      description: Returns active products ordered by sortOrder then name. Public, no authentication required.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of product summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /products/{productId}:
    get:
      tags: [catalog]
      operationId: getProduct
      summary: Get product detail
      description: Returns full details of one active product. Public, no authentication required.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (15 min). Reserved for authenticated endpoints in later releases; catalogue and health are public.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    ProductId:
      name: productId
      in: path
      required: true
      description: Product identifier (UUID)
      schema:
        type: string
        format: uuid
  schemas:
    Money:
      type: object
      description: Monetary amount in integer minor units (pence for GBP), VAT-inclusive. Never a float.
      additionalProperties: false
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 0
          description: Amount in minor units, e.g. 1299 means 12.99 GBP
          examples: [1299]
        currency:
          type: string
          description: ISO 4217 currency code. Only GBP is supported in this release.
          enum: [GBP]
          pattern: '^[A-Z]{3}$'
    ProductSummary:
      type: object
      additionalProperties: false
      required: [id, name, price, thumbnailUrl, inStock, stockQuantity]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        price:
          $ref: '#/components/schemas/Money'
        thumbnailUrl:
          type: [string, 'null']
          description: Thumbnail image URL; null means the client shows a placeholder
        inStock:
          type: boolean
          description: True when stockQuantity is greater than 0
        stockQuantity:
          type: integer
          format: int32
          minimum: 0
          description: Available stock of the default variant
    ProductDetail:
      type: object
      additionalProperties: false
      required: [id, name, description, price, imageUrl, thumbnailUrl, inStock, stockQuantity, defaultVariantId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        price:
          $ref: '#/components/schemas/Money'
        imageUrl:
          type: [string, 'null']
          description: Full-size image URL; null means the client shows a placeholder
        thumbnailUrl:
          type: [string, 'null']
        inStock:
          type: boolean
          description: True when stockQuantity is greater than 0
        stockQuantity:
          type: integer
          format: int32
          minimum: 0
        defaultVariantId:
          type: string
          format: uuid
          description: Id of the product's default variant (stock is tracked per variant)
    ProductPage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        total:
          type: integer
          format: int32
          minimum: 0
          description: Total number of matching products across all pages
        page:
          type: integer
          format: int32
          minimum: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [up]
    Error:
      type: object
      additionalProperties: false
      required: [statusCode, error, message]
      properties:
        statusCode:
          type: integer
          format: int32
          examples: [404]
        error:
          type: string
          examples: [Not Found]
        message:
          type: string
          examples: [Product not found]
  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Database unreachable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
