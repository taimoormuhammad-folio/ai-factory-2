name: server-ci

on:
  push:
    paths:
      - "server/**"
      - "docs/openapi.yaml"
      - "app/openapi.yaml"
      - "app/packages/api_client/**"
      - "app/assets/seed/**"
      - "docker-compose.yml"
      - ".github/workflows/server-ci.yml"
      - "state.json"
      - "scripts/**"
  pull_request:
    paths:
      - "server/**"
      - "docs/openapi.yaml"
      - "app/openapi.yaml"
      - "app/packages/api_client/**"
      - "app/assets/seed/**"
      - "docker-compose.yml"
      - ".github/workflows/server-ci.yml"
      - "state.json"
      - "scripts/**"

jobs:
  assert-done-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject done work items without a commit (BUG-003)
        run: node scripts/assert-done-work-items-have-commits.mjs

  server:
    runs-on: ubuntu-latest
    needs: assert-done-commits
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retail
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - name: Export DATABASE_URL
        run: |
          {
            echo -n "DATABASE_URL=postgresql://"
            echo -n "${POSTGRES_USER}"
            echo -n ":"
            echo -n "${POSTGRES_PASSWORD}"
            echo -n "@localhost:5432/"
            echo "${POSTGRES_DB}?schema=public"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Prisma migrate
        run: npx prisma migrate deploy
      - name: Prisma seed
        run: npx prisma db seed
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: E2E tests
        run: npm run test:e2e
