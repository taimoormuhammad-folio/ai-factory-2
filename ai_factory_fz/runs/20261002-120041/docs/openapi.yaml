openapi: 3.1.0
info:
  title: Laptop Store API
  version: 1.0.0
  description: |
    Laptop Store e-commerce API contract for the M1 Speed Demo and later milestones.
    M1 Flutter app uses local mock data only and does not call this API.
    This document covers must-have catalog stories (US-001 browse, US-002 detail):
    health probe plus two public catalog read operations. Cart is in-memory on
    the client in M1 (US-003) and has no API operations here. Auth, payments,
    checkout, and orders are deferred.
  contact:
    name: Engineering
servers:
  - url: http://10.0.2.2:3000/api/v1
    description: Android emulator → local staging
  - url: https://api.staging.laptopstore.example/api/v1
    description: Staging
  - url: https://api.laptopstore.example/api/v1
    description: Production
tags:
  - name: Health
    description: Service health checks
  - name: Catalog
    description: Laptop product browse and detail (public)
paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Health check
      description: Returns 200 when the service and database are reachable.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service unavailable (database unreachable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products:
    get:
      tags:
        - Catalog
      operationId: listProducts
      summary: List laptops
      description: |
        Paginated laptop listing with optional brand filter, price range, and search.
        Supports US-001 browse requirements. Public endpoint; no authentication required.
        Prices are integer minor units with ISO 4217 currency USD.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Case-insensitive search against product name, brand, and description
          schema:
            type: string
            maxLength: 100
            example: XPS
        - name: brand
          in: query
          description: Filter by laptop brand
          schema:
            $ref: '#/components/schemas/LaptopBrand'
        - name: minPriceCents
          in: query
          description: Minimum display price in USD cents (inclusive)
          schema:
            type: integer
            minimum: 0
            example: 80000
        - name: maxPriceCents
          in: query
          description: Maximum display price in USD cents (inclusive)
          schema:
            type: integer
            minimum: 0
            example: 200000
        - name: inStockOnly
          in: query
          description: When true, exclude products with no in-stock active variants
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          description: Sort order for results
          schema:
            type: string
            enum:
              - priceAsc
              - priceDesc
              - nameAsc
              - newest
            default: newest
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products/{productId}:
    get:
      tags:
        - Catalog
      operationId: getProductById
      summary: Get laptop product detail
      description: |
        Returns full product detail including brand, specs summary, and active variants
        with per-variant stock. Supports US-002. Public endpoint. Flagship demo SKU
        New DELL XPS 13 9300 Laptop must return price 149999 cents USD.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token (15-minute TTL). Declared for M2+ protected endpoints.
        Catalog and health operations in this document do not require a bearer token.
  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ProductId:
      name: productId
      in: path
      required: true
      description: Product UUID
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        database:
          type: string
          enum:
            - up
            - down
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - error
        - message
      properties:
        statusCode:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: Invalid query parameter pageSize
    Money:
      type: object
      additionalProperties: false
      required:
        - amountCents
        - currency
      properties:
        amountCents:
          type: integer
          description: Amount in minor units (cents)
          minimum: 0
          example: 149999
        currency:
          type: string
          description: ISO 4217 currency code
          pattern: '^[A-Z]{3}$'
          example: USD
    LaptopBrand:
      type: string
      description: Laptop manufacturer brand used for browse filters
      enum:
        - Dell
        - Apple
        - HP
        - Lenovo
    Category:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Laptops
        slug:
          type: string
          example: laptops
    ProductSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - brand
        - category
        - price
        - primaryImageUrl
        - inStock
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: New DELL XPS 13 9300 Laptop
        brand:
          $ref: '#/components/schemas/LaptopBrand'
        category:
          $ref: '#/components/schemas/Category'
        price:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Display price (default or lowest active variant)
        primaryImageUrl:
          type: string
          format: uri
        inStock:
          type: boolean
          description: True when at least one active variant has stockQuantity > 0
        specsSummary:
          type: string
          description: Short one-line specs cue for list cards
          example: 13.4" FHD+ · Intel i7 · 16GB · 512GB SSD
    ProductListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
    ProductVariant:
      type: object
      additionalProperties: false
      required:
        - id
        - sku
        - name
        - price
        - stockQuantity
        - isDefault
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          example: DELL-XPS13-9300-16-512
        name:
          type: string
          description: Variant label (e.g. configuration)
          example: 16GB / 512GB SSD
        price:
          $ref: '#/components/schemas/Money'
        stockQuantity:
          type: integer
          minimum: 0
          description: Available stock for this variant (static in M1 mock)
        imageUrl:
          type: string
          format: uri
        isDefault:
          type: boolean
          description: Default variant used for list/detail price and availability
    ProductDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - brand
        - description
        - category
        - price
        - primaryImageUrl
        - inStock
        - variants
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: New DELL XPS 13 9300 Laptop
        brand:
          $ref: '#/components/schemas/LaptopBrand'
        description:
          type: string
          description: Longer listing copy and key details for the detail screen
        specsSummary:
          type: string
          description: Key demo attributes (CPU, RAM, storage, display)
          example: 13.4-inch FHD+ InfinityEdge, Intel Core i7, 16GB RAM, 512GB SSD
        category:
          $ref: '#/components/schemas/Category'
        price:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Display price from default variant (149999 cents USD for XPS 13 flagship)
        primaryImageUrl:
          type: string
          format: uri
        inStock:
          type: boolean
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductVariant'
        returnsPolicyText:
          type: string
          description: Optional return policy note for later checkout UI
          example: |
            14-day returns on unused items in original condition.
            Manufacturer warranty terms apply per brand.
