openapi: 3.1.0
info:
  title: AI Factory E-commerce API
  version: 1.0.0-m1
  description: |
    Milestone 1 contract for the Browse MVP. Catalog reads are public.
    M1 Flutter app may serve an equivalent local/mock catalog; NestJS implements
    these paths in a later milestone. Money is integer minor units (cents) + ISO 4217.
servers:
  - url: http://10.0.2.2:3000/api/v1
    description: Android emulator → local staging (debug cleartext only)
  - url: https://api.example.com/api/v1
    description: Production (HTTPS only)
tags:
  - name: health
  - name: catalog
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Health check
      description: Returns 200 when the API process is up and the database is reachable.
      security: []
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List categories
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List products
      description: Paginated product summaries for the browse screen. Prices in integer cents USD.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional category filter
      responses:
        '200':
          description: Paginated products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /products/{productId}:
    get:
      operationId: getProductById
      tags: [catalog]
      summary: Get product detail
      description: Product detail including description, images, and variants with per-variant stock.
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (15m). Not required for M1 catalog/health.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [statusCode, error, message]
      properties:
        statusCode:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation failed
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [up, down]
    Category:
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    CategoryListResponse:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
    Money:
      type: object
      additionalProperties: false
      required: [amountCents, currencyCode]
      description: Integer minor units; never floats.
      properties:
        amountCents:
          type: integer
          minimum: 0
          example: 2499
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          example: USD
    ProductSummary:
      type: object
      additionalProperties: false
      required: [id, name, price, primaryImageUrl, categoryId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        primaryImageUrl:
          type: string
          format: uri
          description: Absolute or asset URI; client may show placeholder if missing/broken
        categoryId:
          type: string
          format: uuid
    ProductListResponse:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
    ProductVariant:
      type: object
      additionalProperties: false
      required: [id, sku, label, unitPriceCents, currencyCode, stockQuantity, available]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        label:
          type: string
          description: Human-readable variant label (e.g. Size M / Blue)
        unitPriceCents:
          type: integer
          minimum: 0
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          example: USD
        stockQuantity:
          type: integer
          minimum: 0
        available:
          type: boolean
          description: True when stockQuantity > 0
    ProductDetail:
      type: object
      additionalProperties: false
      required: [id, name, description, price, imageUrls, categoryId, variants]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'
          description: Display price (typically from default/lowest variant)
        imageUrls:
          type: array
          minItems: 0
          items:
            type: string
            format: uri
        categoryId:
          type: string
          format: uuid
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductVariant'
security:
  - bearerAuth: []
