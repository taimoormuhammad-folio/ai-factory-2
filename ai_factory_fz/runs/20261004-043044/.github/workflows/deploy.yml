name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/api

jobs:
  build-and-push:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.target }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=staging" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.target.outputs.name }}
            type=sha,prefix=${{ steps.target.outputs.name }}-

      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-push
    if: >
      needs.build-and-push.result == 'success' &&
      (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging')
      )
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            export API_IMAGE="${{ env.IMAGE_NAME }}:staging"
            export POSTGRES_PASSWORD="${{ secrets.STAGING_POSTGRES_PASSWORD }}"
            export DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}"
            export JWT_ACCESS_SECRET="${{ secrets.STAGING_JWT_ACCESS_SECRET }}"
            export JWT_REFRESH_SECRET="${{ secrets.STAGING_JWT_REFRESH_SECRET }}"
            cd "${{ secrets.STAGING_DEPLOY_PATH }}"
            docker compose -f docker-compose.staging.yml pull api
            docker compose -f docker-compose.staging.yml up -d
            curl -fsS "http://127.0.0.1:3000/api/v1/health" | grep -q '"status":"ok"'

  deploy-production:
    needs: build-and-push
    if: >
      needs.build-and-push.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -euo pipefail
            export API_IMAGE="${{ env.IMAGE_NAME }}:production"
            export POSTGRES_PASSWORD="${{ secrets.PRODUCTION_POSTGRES_PASSWORD }}"
            export DATABASE_URL="${{ secrets.PRODUCTION_DATABASE_URL }}"
            export JWT_ACCESS_SECRET="${{ secrets.PRODUCTION_JWT_ACCESS_SECRET }}"
            export JWT_REFRESH_SECRET="${{ secrets.PRODUCTION_JWT_REFRESH_SECRET }}"
            cd "${{ secrets.PRODUCTION_DEPLOY_PATH }}"
            docker compose -f docker-compose.staging.yml pull api
            docker compose -f docker-compose.staging.yml up -d
            curl -fsS "http://127.0.0.1:3000/api/v1/health" | grep -q '"status":"ok"'
