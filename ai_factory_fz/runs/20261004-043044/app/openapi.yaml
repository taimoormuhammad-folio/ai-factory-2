openapi: 3.1.0
info:
  title: Lumen Lighting Retail API
  version: 2.0.0-m3
  description: |
    Contract-first API for Lumen (Lighting Retail UK) Release 2 / M3.
    Pass 1 delivers seven public catalog operations; M3 adds auth, cart, checkout,
    mock payment, orders, and wishlist (twenty-eight counted operations total).
    GET /health and GET /api/docs-json are infrastructure and excluded from the cap.
    Money is integer minor units (pence) with ISO 4217 currency GBP (VAT-inclusive B2C).
  contact:
    name: Lumen Engineering
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://10.0.2.2:3000/api/v1
    description: Android emulator to local staging
  - url: https://api.staging.lumen-lighting.example/api/v1
    description: Staging
tags:
  - name: Health
  - name: Catalog
  - name: Auth
  - name: Users
  - name: Cart
  - name: Checkout
  - name: Payments
  - name: Orders
  - name: Wishlist
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /home:
    get:
      tags: [Catalog]
      operationId: getHome
      summary: Home merchandising
      security: []
      responses:
        '200':
          description: Home data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: List categories
      security: []
      parameters:
        - name: depth
          in: query
          schema:
            type: integer
            enum: [1, 2]
            default: 2
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /categories/{slug}:
    get:
      tags: [Catalog]
      operationId: getCategoryBySlug
      summary: Category by slug
      security: []
      parameters:
        - $ref: '#/components/parameters/CategorySlug'
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDetail'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /catalog/facets:
    get:
      tags: [Catalog]
      operationId: getCatalogFacets
      summary: Catalog filter facets
      security: []
      parameters:
        - name: categorySlug
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Facets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogFacetsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: Search and list products
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema:
            type: string
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: brand
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: minPriceCents
          in: query
          schema:
            type: integer
        - name: maxPriceCents
          in: query
          schema:
            type: integer
        - name: minWattage
          in: query
          schema:
            type: integer
        - name: maxWattage
          in: query
          schema:
            type: integer
        - name: finish
          in: query
          schema:
            type: string
        - name: inStockOnly
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/ProductSort'
      responses:
        '200':
          description: Product page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products/{productId}:
    get:
      tags: [Catalog]
      operationId: getProductById
      summary: Product detail
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products/{productId}/reviews:
    get:
      tags: [Catalog]
      operationId: listProductReviews
      summary: Product reviews
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '409':
          description: Email taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Refresh JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Logged out
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Current profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Users]
      operationId: deleteCurrentUser
      summary: Delete account
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Get cart
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/GuestCartId'
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cart/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: Add cart line
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/GuestCartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '409':
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cart/items/{itemId}:
    patch:
      tags: [Cart]
      operationId: updateCartItem
      summary: Update quantity
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/GuestCartId'
        - $ref: '#/components/parameters/CartItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '404':
          description: Cart item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: Remove line
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/GuestCartId'
        - $ref: '#/components/parameters/CartItemId'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '404':
          description: Cart item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cart/merge:
    post:
      tags: [Cart]
      operationId: mergeGuestCart
      summary: Merge guest cart after login
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GuestCartId'
      responses:
        '200':
          description: Merged cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: Invalid guest cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /checkout/preview:
    post:
      tags: [Checkout]
      operationId: previewCheckout
      summary: Preview totals and shipping
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/GuestCartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutPreviewRequest'
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutPreviewResponse'
        '400':
          description: Invalid address or coupon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Cart empty or not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /checkout/orders:
    post:
      tags: [Checkout]
      operationId: createOrder
      summary: Create order and reserve stock
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/GuestCartId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          description: Invalid checkout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Stock or cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /payments/mock/confirm:
    post:
      tags: [Payments]
      operationId: confirmMockPayment
      summary: Confirm mock payment
      description: No card PAN/CVV fields accepted.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockPaymentConfirmRequest'
      responses:
        '200':
          description: Payment result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockPaymentConfirmResponse'
        '402':
          description: Payment failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: Order history
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrderById
      summary: Order detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /wishlist:
    get:
      tags: [Wishlist]
      operationId: listWishlist
      summary: List wishlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Wishlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /wishlist/items:
    post:
      tags: [Wishlist]
      operationId: addWishlistItem
      summary: Add wishlist item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWishlistItemRequest'
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /wishlist/items/{productId}:
    delete:
      tags: [Wishlist]
      operationId: removeWishlistItem
      summary: Remove wishlist item
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: Removed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Wishlist item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (15 min TTL).
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategorySlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    GuestCartId:
      name: X-Guest-Cart-Id
      in: header
      schema:
        type: string
        format: uuid
    CartItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [statusCode, error, message]
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, database, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]
        timestamp:
          type: string
          format: date-time
    Money:
      type: object
      additionalProperties: false
      required: [amountCents, currency]
      properties:
        amountCents:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: GBP
    ProductSort:
      type: string
      enum: [priceAsc, priceDesc, newest, popularity]
      default: popularity
    CategorySummary:
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        parentId:
          type: [string, 'null']
          format: uuid
        imageUrl:
          type: string
          format: uri
    CategoryDetail:
      allOf:
        - $ref: '#/components/schemas/CategorySummary'
        - type: object
          properties:
            description:
              type: string
            children:
              type: array
              items:
                $ref: '#/components/schemas/CategorySummary'
    CategoryListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategorySummary'
    HomeBanner:
      type: object
      required: [id, title, imageUrl, ctaLabel]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        subtitle:
          type: string
        imageUrl:
          type: string
          format: uri
        ctaLabel:
          type: string
        categorySlug:
          type: string
    HomeResponse:
      type: object
      required: [categories, banners, featuredProducts, newArrivals]
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategorySummary'
        banners:
          type: array
          items:
            $ref: '#/components/schemas/HomeBanner'
        featuredProducts:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        newArrivals:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
    RatingSummary:
      type: object
      required: [averageRating, reviewCount]
      properties:
        averageRating:
          type: number
        reviewCount:
          type: integer
    ProductSummary:
      type: object
      required: [id, name, brand, slug, category, price, primaryImageUrl, inStock, rating]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        brand:
          type: string
        slug:
          type: string
        category:
          $ref: '#/components/schemas/CategorySummary'
        price:
          $ref: '#/components/schemas/Money'
        primaryImageUrl:
          type: string
        inStock:
          type: boolean
        rating:
          $ref: '#/components/schemas/RatingSummary'
    ProductListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    LightingSpecs:
      type: object
      properties:
        wattageW:
          type: integer
        lumens:
          type: integer
        colorTemperatureK:
          type: integer
        ipRating:
          type: string
        dimmable:
          type: boolean
        finish:
          type: string
        dimensionsMm:
          type: string
        installationType:
          type: string
    ProductVariant:
      type: object
      required: [id, sku, label, price, stockQuantity, availableQuantity, isDefault]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        label:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        stockQuantity:
          type: integer
        availableQuantity:
          type: integer
        finish:
          type: string
        wattageW:
          type: integer
